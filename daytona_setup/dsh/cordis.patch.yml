# DSH を Nosana の OpenAI 互換エンドポイントへ向ける設定。
# 置き場所（サンドボックス内）: ~/.dsh/profiles/headless/cordis.patch.yml
# URL・モデルID・キーはここに書かず、すべて環境変数から読む。
#   NOSANA_BASE_URL  例: https://inference.nosana.com/v1 （/v1 まで含める）
#   NOSANA_MODEL     エンドポイントが提供するモデルID
#   NOSANA_API_KEY   Daytona Secret として渡す（サンドボックス内では置き換え用の仮の値）

- id: llm-pi-ai
  config:
    providers:
      nosana:
        apiKeyEnv: NOSANA_API_KEY
        api: openai-completions
        baseURL: !!js process.env.NOSANA_BASE_URL
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.NOSANA_MODEL

- id: agent-default-model
  config:
    provider: nosana
    model: !!js process.env.NOSANA_MODEL
